<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Monaco 2018 Report{% endblock %}</title>

    <!-- Connected with Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
</head>
<body class="bg-light text-dark">

<!-- Navigation -->
{% block navigation %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
   <div class="container-fluid">
       <a class="navbar-brand" href="{{ url_for('home_page') }}">Monaco 2018 Report</a>
       <div class="navbar-nav">
           <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('home_page') }}"> Home </a>
           <a class="nav-link {% if request.path.startswith('/report') and '/drivers' not in request.path %}active{% endif %}" href="{{ url_for('report_page') }}"> Overview </a>
           <a class="nav-link {% if '/report/drivers' in request.path %}active{% endif %}" href="{{ url_for('drivers_page') }}"> Drivers </a>
       </div>
   </div>
</nav>
{% endblock %}

<div class="container">
    {% block content %}{% endblock %}
</div>

{% block footer %}
<footer class="text-center mt-5 mb-3 text-muted">
    &copy; {{ current_year }} Monaco 2018 Report — built with Flask 🏎️
</footer>
{% endblock %}
</body>
</html>
