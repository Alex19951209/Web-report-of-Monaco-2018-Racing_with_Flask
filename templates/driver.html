{% extends "base.html" %}

{% block content %}
<h2>Driver Info</h2>

<div class="card mt-3 p-3">
    <h4>{{ driver.name }} ({{ driver.abbr }})</h4>
    <p><strong>Team:</strong> {{ driver.team }}</p>
    <p><strong>Best Lap:</strong> {{ driver.time }}</p>

    <a href="{{ url_for('drivers_page') }}" class="btn btn-secondary mt-2">Back to Drivers</a>
</div>
{% endblock %}
